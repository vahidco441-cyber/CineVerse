<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بازیابی رمز عبور | CineVerse</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #39280c, transparent 45%), #080808;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
    }
    .card {
      width: min(440px, 100%);
      padding: 30px;
      border: 1px solid rgba(212,175,55,.4);
      border-radius: 20px;
      background: rgba(255,255,255,.05);
      box-shadow: 0 15px 50px #0008;
    }
    h1 { color: #f5dc83; font-size: 24px; margin-top: 0; }
    p { color: #bbb; line-height: 2; }
    label { display: block; margin: 18px 0; color: #ddd; }
    input {
      display: block;
      width: 100%;
      margin-top: 9px;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #151515;
      color: white;
      font: inherit;
      direction: ltr;
    }
    button, .link {
      display: block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg,#f5dc83,#b58a20);
      color: #111;
      font: bold 15px Tahoma, sans-serif;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #resetMessage { min-height: 28px; font-size: 14px; }
    #resetForm[hidden] { display: none; }
    .back { margin-top: 14px; background: #222; color: #fff; border: 1px solid #444; }
  </style>
</head>
<body>
  <main class="card">
    <h1>CineVerse | تعیین رمز جدید</h1>
    <p id="resetMessage">در حال بررسی لینک بازیابی...</p>

    <form id="resetForm" hidden>
      <label>
        رمز جدید (حداقل ۸ کاراکتر)
        <input id="newPassword" type="password" minlength="8"
          autocomplete="new-password" required>
      </label>

      <label>
        تکرار رمز جدید
        <input id="confirmPassword" type="password" minlength="8"
          autocomplete="new-password" required>
      </label>

      <button id="savePasswordBtn" type="submit">ذخیره رمز جدید</button>
    </form>

    <a class="link back" href="admin.html">بازگشت به ورود مدیر</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script defer src="reset-password.js"></script>
</body>
</html>
