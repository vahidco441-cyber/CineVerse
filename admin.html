<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت CineVerse</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="admin.js"></script></head><body><header><a class="logo" href="index.html">Cine<span>Verse</span></a><a class="btn" href="index.html">بازگشت به سایت</a></header><main class="admin"><h1>پنل <em>مدیریت</em></h1><section id="loginPanel" class="panel"><h2>ورود مدیر</h2><p>با ایمیل و رمز عبور حساب مدیر Supabase وارد شو.</p><form id="loginForm"><label>ایمیل<input id="email" type="email" required></label><label>رمز عبور<input id="password" type="password" required></label><button class="btn">ورود</button></form><p id="loginMessage"></p></section><section id="dashboard" hidden><div class="panel"><h2 id="formTitle">افزودن فیلم</h2><button id="logoutBtn" class="btn secondary" type="button">خروج</button><form id="movieForm"><input id="movieId" type="hidden"><label>نام فیلم *<input id="title" required></label><div class="two"><label>سال<input id="year" type="number"></label><label>امتیاز<input id="rating" type="number" min="0" max="10" step=".1"></label></div><div class="two"><label>دسته‌بندی<select id="category"><option>سایر</option><option>اکشن</option><option>درام</option><option>کمدی</option><option>ترسناک</option><option>علمی‌تخیلی</option><option>عاشقانه</option><option>مستند</option></select></label><label>زبان<input id="language"></label></div><label>لینک پوستر<input id="posterUrl" type="url"></label><label>لینک مستقیم فیلم<input id="videoUrl" type="url"></label><label>توضیحات<textarea id="overview" rows="3"></textarea></label><label class="inline"><input id="published" type="checkbox" checked> انتشار در سایت</label><button class="btn">ذخیره فیلم</button><button id="resetBtn" class="btn secondary" type="button">پاک کردن فرم</button><p id="formMessage"></p></form></div><div class="panel"><h2>فیلم‌های ثبت‌شده</h2><div id="adminMovies"></div></div></section></main><footer>CineVerse Studio</footer></body></html>
