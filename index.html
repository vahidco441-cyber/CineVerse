<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CineVerse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Cine<span>Verse</span></div>
    <nav>
      <a class="active" href="#hero">خانه</a>
      <a href="#newest">فیلم‌ها</a>
    </nav>
    <div class="header-actions">
      <div class="search-box" aria-label="جستجو">
        <span>⌕</span><input id="searchInput" placeholder="جستجوی فیلم..." autocomplete="off">
      </div>
      <button id="tgBtn" class="icon-btn" title="کانال تلگرام">✈</button>
    </div>
  </header>

  <main>
    <section id="hero" class="hero">
      <div class="hero-shade"></div>
      <div class="hero-content">
        <div class="hero-kicker"><span></span> پیشنهاد CineVerse</div>
        <h1 id="heroTitle">در حال بارگذاری...</h1>
        <div id="heroMeta" class="hero-meta"></div>
        <p id="heroOverview" class="hero-overview"></p>
        <div class="hero-buttons">
          <button id="heroPlay" class="play-btn"><b>▶</b> تماشا در تلگرام</button>
          <button id="heroChannel" class="watch-btn"><b>✈</b> کانال CineVerse</button>
        </div>
      </div>
      <div class="hero-bottom-fade"></div>
    </section>

    <section id="status" class="status">در حال بارگذاری فیلم‌ها...</section>

    <section id="newest" class="section newest-section">
      <div class="section-head">
        <div>
          <h2>فیلم‌ها</h2>
          <p>Movies</p>
        </div>
      </div>
      <div id="newestGrid" class="movie-grid"></div>
    </section>
  </main>

  <script src="movies.js"></script>
  <script src="script.js"></script>
</body>
</html>
