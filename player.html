<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineVerse Player</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="player-page">

<header class="topbar player-topbar">
  <div class="brand">Cine<span>Verse</span></div>
  <a class="back-home" href="index.html">← بازگشت به CineVerse</a>
</header>

<main class="player-shell">

  <div id="playerStatus" class="player-status">
    در حال آماده‌سازی پخش
  </div>

  <section class="standalone-player">

    <video
      id="standaloneVideo"
      controls
      playsinline
      preload="metadata">
    </video>

    <div class="player-info">
      <div>
        <div id="standaloneTitle" class="standalone-title">
          فیلم آزمایشی
        </div>
        <div id="standaloneMeta" class="standalone-meta">
          GitHub Video
        </div>
      </div>

      <a id="jellyfinLink" class="jellyfin-link"
         target="_blank" rel="noopener">
        دریافت فایل
      </a>
    </div>

  </section>
</main>

<script src="config.js"></script>

<script>
const $ = id => document.getElementById(id);

const qs = new URLSearchParams(location.search);

const defaultVideo =
"https://raw.githubusercontent.com/vahidco441-cyber/CineVerse/main/videos/_WqVViW3eCuSla7E.mp4";

const videoUrl = qs.get('video') || defaultVideo;
const name = qs.get('name') || 'فیلم آزمایشی';
const year = qs.get('year') || 'GitHub';

function status(message, type = '') {
  $('playerStatus').textContent = message;
  $('playerStatus').className = 'player-status ' + type;
}

function start() {

  $('standaloneTitle').textContent = name;
  $('standaloneMeta').textContent = year;

  const video = $('standaloneVideo');

  $('jellyfinLink').href = videoUrl;

  video.addEventListener('loadedmetadata', () => {
    status('فیلم آماده پخش است', 'ok');
  });

  video.addEventListener('error', () => {
    status('خطا در پخش فیلم. آدرس یا فرمت فایل را بررسی کنید.', 'error');
  });

  video.addEventListener('waiting', () => {
    status('در حال بارگذاری فیلم...');
  });

  video.src = videoUrl;
  video.load();

}

start();
</script>

</body>
</html>
